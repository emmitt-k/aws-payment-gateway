version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DynamoDB Local
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb
    ports:
      - "8000:8000"
    command: ["java", "-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth:
    build:
      context: .
      dockerfile: cmd/auth-svc/Dockerfile
    container_name: auth
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_gateway
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_REGION: us-west-2
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Payin Service
  payin:
    build:
      context: .
      dockerfile: cmd/payin-svc/Dockerfile
    container_name: payin
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_gateway
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_REGION: us-west-2
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - microservices

  # Observer Service
  observer:
    build:
      context: .
      dockerfile: cmd/observer-svc/Dockerfile
    container_name: observer
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_gateway
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_REGION: us-west-2
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - microservices

  # Ledger Service
  ledger:
    build:
      context: .
      dockerfile: cmd/ledger-svc/Dockerfile
    container_name: ledger
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_gateway
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_REGION: us-west-2
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - microservices

  # Payout Service
  payout:
    build:
      context: .
      dockerfile: cmd/payout-svc/Dockerfile
    container_name: payout
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: payment_gateway
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_REGION: us-west-2
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - microservices

  # DynamoDB Admin
  admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: admin
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
    ports:
      - "8001:8001"
    depends_on:
      - dynamodb
    networks:
      - app-network
    profiles:
      - admin

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge