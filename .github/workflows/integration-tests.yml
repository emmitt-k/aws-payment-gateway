name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.23'
  POSTGRES_VERSION: '16'
  DYNAMODB_VERSION: 'latest'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}-alpine
        env:
          POSTGRES_DB: test_payment_gateway
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready -U test_user -d test_payment_gateway
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        volumes:
          - postgres_test_data:/var/lib/postgresql/data
      
      dynamodb:
        image: amazon/dynamodb-local:${{ env.DYNAMODB_VERSION }}
        ports:
          - 8001:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        run: |
          java -jar DynamoDBLocal.jar -sharedDb -inMemory

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        go mod download
        sudo apt-get update
        sudo apt-get install -y curl

    - name: Wait for services to be ready
      run: |
        echo "Waiting for PostgreSQL..."
        timeout 60 bash -c 'until nc -z localhost 5433; do sleep 1; done'
        echo "Waiting for DynamoDB..."
        timeout 60 bash -c 'until curl -f http://localhost:8001; do sleep 1; done'
        echo "Services are ready!"

    - name: Run database migrations
      run: |
        # Wait a bit more to ensure databases are fully ready
        sleep 10
        echo "Running database migrations..."
        # Apply migrations using migrate tool or direct SQL
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000001_create_accounts_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000002_create_ledger_accounts_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000003_create_journal_entries_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000004_create_postings_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000005_create_balances_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000006_create_payin_addresses_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000007_create_payin_requests_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000008_create_observed_transactions_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000009_create_payout_requests_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000010_create_system_wallets_table.up.sql || true
        PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d test_payment_gateway -f migrations/000011_create_chain_cursors_table.up.sql || true

    - name: Setup DynamoDB tables
      run: |
        echo "Setting up DynamoDB tables..."
        # Create DynamoDB tables using AWS CLI
        aws dynamodb create-table \
          --table-name test-auth-service \
          --attribute-definitions \
            AttributeName=id,AttributeType=S \
            AttributeName=account_id,AttributeType=S \
          --key-schema \
            AttributeName=id,KeyType=HASH \
          --global-secondary-indexes \
            '[{"IndexName":"account_id_index","KeySchema":[{"AttributeName":"account_id","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"},"ProvisionedThroughput":{"ReadCapacityUnits":5,"WriteCapacityUnits":5}}]' \
          --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
          --endpoint-url http://localhost:8001 \
          --region us-west-2 || true
        
        aws dynamodb create-table \
          --table-name test-audit_logs \
          --attribute-definitions \
            AttributeName=partition_key,AttributeType=S \
            AttributeName=sort_key,AttributeType=S \
          --key-schema \
            AttributeName=partition_key,KeyType=HASH \
            AttributeName=sort_key,KeyType=RANGE \
          --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
          --endpoint-url http://localhost:8001 \
          --region us-west-2 || true
        
        aws dynamodb create-table \
          --table-name test-idempotency_keys \
          --attribute-definitions \
            AttributeName=idempotency_key,AttributeType=S \
            AttributeName=account_id,AttributeType=S \
          --key-schema \
            AttributeName=idempotency_key,KeyType=HASH \
          --global-secondary-indexes \
            '[{"IndexName":"account_id_index","KeySchema":[{"AttributeName":"account_id","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"},"ProvisionedThroughput":{"ReadCapacityUnits":5,"WriteCapacityUnits":5}}]' \
          --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
          --endpoint-url http://localhost:8001 \
          --region us-west-2 || true
        
        aws dynamodb create-table \
          --table-name test-rate_limits \
          --attribute-definitions \
            AttributeName=key,AttributeType=S \
          --key-schema \
            AttributeName=key,KeyType=HASH \
          --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
          --endpoint-url http://localhost:8001 \
          --region us-west-2 || true

    - name: Run integration tests
      env:
        TEST_POSTGRES_HOST: localhost
        TEST_POSTGRES_PORT: 5433
        TEST_POSTGRES_USER: test_user
        TEST_POSTGRES_PASSWORD: test_password
        TEST_POSTGRES_DB: test_payment_gateway
        TEST_DYNAMODB_ENDPOINT: http://localhost:8001
        TEST_DYNAMODB_REGION: us-west-2
        TEST_DYNAMODB_TABLE: test-auth-service
        TEST_AUDIT_LOGS_TABLE: test-audit_logs
        TEST_TIMEOUT: 30
        TEST_CLEANUP: true
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_REGION: us-west-2
      run: |
        make test-integration-ci

    - name: Generate coverage report
      if: always()
      run: |
        go tool cover -html=coverage-integration.out -o coverage-integration.html

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage-integration.out
        flags: integration
        name: integration-coverage
        fail_ci_if_error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results
        path: |
          coverage-integration.out
          coverage-integration.html
        retention-days: 30

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          coverage-*.out
          coverage-*.html
        retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build application
      run: |
        make build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: auth-service-binary
        path: bin/
        retention-days: 7